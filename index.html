<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a1628" />
    <title>AURELIA — Ride the Dusk Winds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Aurelia game canvas"></canvas>

      <div id="hud" class="hidden" aria-live="polite">
        <div class="hud-left">
          <div class="hud-label">Score</div>
          <div id="score" class="hud-value">0</div>
        </div>
        <div class="hud-center">
          <div id="combo" class="combo hidden">×2</div>
        </div>
        <div class="hud-right">
          <div class="hud-label">Distance</div>
          <div id="distance" class="hud-value">0m</div>
        </div>
      </div>

      <div id="boost-bar" class="hidden" aria-hidden="true">
        <div id="boost-fill"></div>
      </div>

      <div id="overlay" class="overlay">
        <div class="overlay-inner">
          <p class="eyebrow">A sky glider</p>
          <h1 class="brand">AURELIA</h1>
          <p id="tagline" class="tagline">Ride the dusk winds. Gather the lanterns.</p>
          <div id="menu-stats" class="menu-stats hidden">
            <div>
              <span class="stat-label">Score</span>
              <span id="final-score" class="stat-value">0</span>
            </div>
            <div>
              <span class="stat-label">Best</span>
              <span id="best-score" class="stat-value">0</span>
            </div>
            <div>
              <span class="stat-label">Distance</span>
              <span id="final-distance" class="stat-value">0m</span>
            </div>
          </div>
          <button id="start-btn" type="button" class="cta">Begin Flight</button>
          <p id="hint" class="hint">
            WASD / Arrows to steer · Space to boost · P to pause
          </p>
        </div>
      </div>

      <div id="pause" class="overlay hidden">
        <div class="overlay-inner compact">
          <h2 class="pause-title">Paused</h2>
          <p class="tagline">The wind holds still.</p>
          <button id="resume-btn" type="button" class="cta">Resume</button>
        </div>
      </div>

      <div id="touch-hint" class="touch-hint hidden">Drag to steer · Hold for boost</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
